[package]
name = "fusionplay-host"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fusionplay-miplay-sdk = { path = "../FusionPlay.MiPlaySdk" }
if-addrs = { path = "../FusionPlay.AndroidIfAddrs" }
uniffi = { version = "=0.29.4", features = ["cli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
cpal = "0.17"
getifs = "=0.6.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[[bin]]
name = "fusionplay-bindgen"
path = "src/bindgen.rs"

[[bin]]
name = "fusionplay-diagnostic"
path = "src/diagnostic.rs"
